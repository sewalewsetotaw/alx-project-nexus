databases:
  - name: ecommerce_db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user

services:
  - type: web
    plan: free
    name: ecommerce-backend
    runtime: python
    buildCommand: "./ecommerce_backend/build.sh"
    startCommand: "cd ecommerce_backend && python -m gunicorn ecommerce_backend.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
