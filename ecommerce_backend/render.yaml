databases:
  - name: ecommerce_db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user

services:
  - type: web
    plan: free
    name: ecommerce-backend
    runtime: python
    buildCommand: "pip install -r ecommerce_backend/requirements.txt && python ecommerce_backend/manage.py collectstatic --noinput && python ecommerce_backend/manage.py migrate"

    startCommand: "cd ecommerce_backend && gunicorn ecommerce_backend.ecommerce_backend.asgi:application -k uvicorn.workers.UvicornWorker"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
